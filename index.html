<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arquivo</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;
background:#050505;
height:100vh;
font-family:Arial,sans-serif;
color:white;

display:flex;
justify-content:center;
align-items:center;

}


/* CAPA INICIAL */

#inicio{

text-align:center;
width:100%;

}


.capa{

width:95%;
max-width:650px;

}



button{

margin-top:25px;
padding:15px 45px;

background:#8b0000;
color:white;

border:none;

font-size:18px;

letter-spacing:2px;

cursor:pointer;

}


button:hover{

background:#b30000;

}



/* SENHA */

#senha{

display:none;
text-align:center;

}


input{

margin-top:20px;

padding:15px;

width:260px;

font-size:18px;

text-align:center;

}



.erro{

color:#ff4444;

}



/* ARQUIVO ABERTO */

#arquivo{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100vh;

background-image:url("interno.jpg");

background-size:cover;

background-position:center;

overflow:hidden;

}




/* FOTOS */

.foto{

position:absolute;

width:130px;

border:8px solid white;

box-shadow:0 5px 15px black;

}




.f1{top:40px;left:40px;transform:rotate(-5deg);}
.f2{top:60px;right:50px;transform:rotate(6deg);}
.f3{top:220px;left:180px;transform:rotate(3deg);}
.f4{top:350px;right:120px;transform:rotate(-7deg);}
.f5{bottom:60px;left:60px;transform:rotate(5deg);}

.f6{top:120px;left:420px;transform:rotate(-4deg);}
.f7{top:400px;left:250px;transform:rotate(7deg);}
.f8{bottom:200px;right:350px;transform:rotate(-5deg);}
.f9{top:180px;right:280px;transform:rotate(4deg);}
.f10{bottom:80px;left:350px;transform:rotate(-6deg);}

.f11{top:300px;right:40px;transform:rotate(5deg);}
.f12{bottom:300px;left:40px;transform:rotate(-4deg);}
.f13{top:500px;left:180px;transform:rotate(6deg);}
.f14{top:30px;left:280px;transform:rotate(-8deg);}
.f15{bottom:150px;right:220px;transform:rotate(5deg);}

.f16{top:350px;left:500px;transform:rotate(-6deg);}
.f17{bottom:40px;right:40px;transform:rotate(4deg);}
.f18{top:220px;right:500px;transform:rotate(-5deg);}
.f19{bottom:250px;left:500px;transform:rotate(7deg);}
.f20{top:550px;right:300px;transform:rotate(-4deg);}

.f21{top:450px;right:450px;transform:rotate(6deg);}
.f22{bottom:350px;right:80px;transform:rotate(-7deg);}
.f23{top:100px;right:450px;transform:rotate(5deg);}
.f24{bottom:100px;left:550px;transform:rotate(-6deg);}



</style>

</head>



<body>



<div id="inicio">


<img class="capa" src="capa.jpg">


<br>


<button onclick="abrirSenha()">

ABRIR ARQUIVO

</button>


</div>





<div id="senha">


<h2>DIGITE A SENHA</h2>


<input id="codigo" type="password" placeholder="Senha">


<br>


<button onclick="verificarSenha()">

ENTRAR

</button>


<p class="erro" id="erro"></p>


</div>





<div id="arquivo">


<img class="foto f1" src="foto1.jpeg">
<img class="foto f2" src="foto2.jpeg">
<img class="foto f3" src="foto3.jpeg">
<img class="foto f4" src="foto4.jpeg">
<img class="foto f5" src="foto5.jpeg">

<img class="foto f6" src="foto6.jpeg">
<img class="foto f7" src="foto7.jpeg">
<img class="foto f8" src="foto8.jpeg">
<img class="foto f9" src="foto9.jpeg">
<img class="foto f10" src="foto10.jpeg">

<img class="foto f11" src="foto11.jpeg">
<img class="foto f12" src="foto12.jpeg">
<img class="foto f13" src="foto13.jpeg">
<img class="foto f14" src="foto14.jpeg">
<img class="foto f15" src="foto15.jpeg">

<img class="foto f16" src="foto16.jpeg">
<img class="foto f17" src="foto17.jpeg">
<img class="foto f18" src="foto18.jpeg">
<img class="foto f19" src="foto19.jpeg">
<img class="foto f20" src="foto20.jpeg">

<img class="foto f21" src="foto21.jpeg">
<img class="foto f22" src="foto22.jpeg">
<img class="foto f23" src="foto23.jpeg">
<img class="foto f24" src="foto24.jpeg">


</div>






<script>


function abrirSenha(){

document.getElementById("inicio").style.display="none";

document.getElementById("senha").style.display="block";

}





function verificarSenha(){


let senha = document.getElementById("codigo").value;



if(senha === "07082001DRB"){


document.getElementById("senha").style.display="none";


document.getElementById("arquivo").style.display="block";


}

else{


document.getElementById("erro").innerHTML="SENHA INCORRETA";


}


}



</script>



</body>

</html>

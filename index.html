<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arquivo</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;
background:#050505;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;
overflow:hidden;
perspective:1500px;

}



.livro{

width:90%;
max-width:650px;
text-align:center;
transform-style:preserve-3d;

}



.capa{

width:100%;
transform-origin:left center;
backface-visibility:hidden;

}



.abrir{

animation:virarPagina 1.8s forwards;

}



@keyframes virarPagina{


0%{

transform:rotateY(0deg);

}



100%{

transform:rotateY(-110deg);

}


}



button{

margin-top:25px;
padding:15px 45px;
background:#8b0000;
color:white;
border:0;
font-size:18px;
cursor:pointer;
letter-spacing:2px;

}



button:hover{

background:#b30000;

}



.senha{

display:none;
color:white;
text-align:center;

}



input{

padding:15px;
font-size:18px;
width:250px;
text-align:center;

}



</style>

</head>



<body>


<div class="livro" id="livro">


<img class="capa" src="capa.jpg">


<button onclick="abrirLivro()">

ABRIR ARQUIVO

</button>


</div>



<div class="senha" id="senha">


<h2>DIGITE A SENHA</h2>

<input type="password">


<br>


<button>

ENTRAR

</button>


</div>



<script>


function abrirLivro(){


document.querySelector(".capa").classList.add("abrir");



setTimeout(function(){


document.getElementById("livro").style.display="none";


document.getElementById("senha").style.display="block";


},1800);



}


</script>


</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arquivo</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;
background:#050505;
height:100vh;
font-family:Arial,sans-serif;
color:white;

display:flex;
justify-content:center;
align-items:center;

}


/* CAPA INICIAL */

#inicio{

text-align:center;
width:100%;

}


.capa{

width:95%;
max-width:650px;

}



button{

margin-top:25px;
padding:15px 45px;

background:#8b0000;
color:white;

border:none;

font-size:18px;

letter-spacing:2px;

cursor:pointer;

}


button:hover{

background:#b30000;

}



/* SENHA */

#senha{

display:none;
text-align:center;

}


input{

margin-top:20px;

padding:15px;

width:260px;

font-size:18px;

text-align:center;

}



.erro{

color:#ff4444;

}



/* ARQUIVO ABERTO */

#arquivo{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100vh;


background-image:url("interno.jpg");

background-size:cover;

background-position:center;

}




</style>

</head>



<body>



<div id="inicio">


<img class="capa" src="capa.jpg">


<br>


<button onclick="abrirSenha()">

ABRIR ARQUIVO

</button>


</div>





<div id="senha">


<h2>DIGITE A SENHA</h2>


<input id="codigo" type="password" placeholder="Senha">


<br>


<button onclick="verificarSenha()">

ENTRAR

</button>


<p class="erro" id="erro"></p>


</div>





<div id="arquivo">


</div>






<script>


function abrirSenha(){

document.getElementById("inicio").style.display="none";

document.getElementById("senha").style.display="block";

}





function verificarSenha(){


let senha = document.getElementById("codigo").value;



if(senha === "07082001DRB"){


document.getElementById("senha").style.display="none";


document.getElementById("arquivo").style.display="block";


}

else{


document.getElementById("erro").innerHTML="SENHA INCORRETA";


}


}



</script>



</body>

</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arquivo Confidencial</title>

<style>
body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px;
}

.caixa {
    border: 2px solid red;
    padding: 25px;
    max-width: 350px;
    margin: auto;
}

button {
    padding: 10px 20px;
    cursor: pointer;
}

#conteudo {
    display: none;
}

img {
    width: 90%;
    max-width: 400px;
    margin: 15px;
}
</style>

</head>

<body>

<div class="caixa" id="login">

<h1>🔒 Arquivo Confidencial</h1>

<p>Digite a senha de acesso:</p>

<input type="password" id="senha">

<br><br>

<button onclick="entrar()">Acessar</button>

<p id="erro"></p>

</div>


<div id="conteudo">

<h1>🗂 Relatório Secreto</h1>

<p>
Coloque aqui seus textos, mensagens e pistas.
</p>

<!-- Suas fotos entram aqui depois -->

</div>


<script>

function entrar(){

let senha = document.getElementById("senha").value;

if(senha == "07082001DRB"){

document.getElementById("login").style.display="none";

document.getElementById("conteudo").style.display="block";

}

else{

document.getElementById("erro").innerHTML="Senha incorreta";

}

}

</script>

</body>
</html>

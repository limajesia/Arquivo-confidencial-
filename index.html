<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arquivo Confidencial</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 30px 20px;
}

h1 {
    font-size: 32px;
    letter-spacing: 3px;
    color: #b30000;
}

img {
    width: 100%;
    max-width: 450px;
    border: 3px solid #8b0000;
    box-shadow: 0 0 20px black;
}

.card {
    margin-top: 25px;
    background: #111;
    border: 1px solid #444;
    padding: 20px;
    border-radius: 10px;
}

p {
    line-height: 1.6;
}

button {
    margin-top: 20px;
    padding: 15px 30px;
    background: #8b0000;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #c00000;
}

</style>

</head>

<body>

<div class="container">

<h1>ARQUIVO CONFIDENCIAL</h1>

<img src="capa.jpg" alt="Arquivo">

<div class="card">

<p>
Este arquivo contém informações especiais.
<br><br>
Apenas pessoas autorizadas devem acessar este conteúdo.
</p>

<button>
ACESSAR ARQUIVO
</button>

</div>

</div>

</body>
</html>

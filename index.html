<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arquivo Confidencial</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#111;
    font-family:Arial, Helvetica, sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

}

#capa{

    width:700px;
    max-width:90%;

    background:#d8c49b;

    border:8px solid #8e7855;

    padding:60px;

    box-shadow:0 0 40px rgba(0,0,0,.6);

    position:relative;

}

#capa::before{

content:"CONFIDENCIAL";

position:absolute;

right:25px;
top:30px;

color:#a10000;

border:4px solid #a10000;

padding:8px 18px;

font-size:34px;

font-weight:bold;

transform:rotate(-12deg);

}

.numero{

font-size:15px;

letter-spacing:4px;

color:#444;

margin-bottom:35px;

}

h1{

font-size:55px;

color:#202020;

margin-bottom:20px;

}

h2{

font-size:25px;

margin-bottom:15px;

color:#555;

}

p{

font-size:18px;

line-height:30px;

color:#333;

}

button{

margin-top:45px;

padding:18px 55px;

font-size:20px;

background:#2b2b2b;

color:white;

border:none;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#8d0000;

transform:scale(1.05);

}

</style>

</head>

<body>

<section id="capa">

<div class="numero">
ARQUIVO Nº 01-2909
</div>

<h1>Dossiê Confidencial</h1>

<h2>Acesso Restrito</h2>

<p>

Este arquivo contém registros pessoais e memórias importantes.

Apenas pessoas autorizadas podem continuar.

</p>

<button>

ENTRAR

</button>

</section>

</body>
</html>

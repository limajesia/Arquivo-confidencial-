<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arquivo</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;
background:#050505;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;
color:white;

}


.container{

text-align:center;
width:100%;

}


.capa{

width:95%;
max-width:650px;

}


button{

margin-top:25px;
padding:15px 45px;
background:#8b0000;
color:white;
border:none;
font-size:18px;
letter-spacing:2px;
cursor:pointer;

}


button:hover{

background:#b30000;

}



.telaSenha{

display:none;
text-align:center;

}



input{

margin-top:20px;
padding:15px;
width:260px;
font-size:18px;
text-align:center;

}



.arquivo{

display:none;
text-align:center;

}


.arquivo img{

width:90%;
max-width:500px;

}


.mensagem{

margin-top:20px;
color:#ff4444;

}


</style>

</head>


<body>


<div class="container" id="inicio">


<img class="capa" src="capa.jpg">


<br>


<button onclick="abrirSenha()">

ABRIR ARQUIVO

</button>


</div>




<div class="telaSenha" id="senha">


<h2>DIGITE A SENHA</h2>


<input id="codigo" type="password" placeholder="Senha">


<br>


<button onclick="verificarSenha()">

ENTRAR

</button>


<p class="mensagem" id="erro"></p>


</div>




<div class="arquivo" id="arquivo">


<h1>ACESSO AUTORIZADO</h1>


<p>
Bem-vindo ao arquivo secreto.
</p>


</div>





<script>


function abrirSenha(){


document.getElementById("inicio").style.display="none";


document.getElementById("senha").style.display="block";


}





function verificarSenha(){


let senhaDigitada = document.getElementById("codigo").value;



if(senhaDigitada === "07082001DRB"){


document.getElementById("senha").style.display="none";


document.getElementById("arquivo").style.display="block";


}

else{


document.getElementById("erro").innerHTML="SENHA INCORRETA";


}


}



</script>


</body>
</html>

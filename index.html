<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arquivo Confidencial</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#0b0b0b;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    overflow:hidden;

    font-family:Arial, Helvetica, sans-serif;

}

#capa{

    width:min(90vw,700px);

    transition:.35s;

    cursor:pointer;

    filter:drop-shadow(0 25px 30px rgba(0,0,0,.7));

}

#capa:hover{

    transform:scale(1.02) rotate(-1deg);

}

</style>

</head>

<body>

<img id="capa" src="capa.jpg" alt="Arquivo Confidencial">

<script>

document.getElementById("capa").onclick=function(){

    alert("Em breve essa pasta será aberta...");

}

</script>

</body>
</html>

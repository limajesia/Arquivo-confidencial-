<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arquivo</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}


.container {
    text-align: center;
    width: 100%;
}


.capa {
    width: 95%;
    max-width: 600px;
    animation: aparecer 1.5s ease;
}


button {
    margin-top: 25px;
    padding: 15px 45px;
    background: #8b0000;
    color: white;
    border: none;
    font-size: 18px;
    letter-spacing: 2px;
    cursor: pointer;
}


button:hover {
    background: #b30000;
}


/* tela da senha */

.senha {
    display: none;
    color: white;
    text-align: center;
}


input {
    margin-top: 20px;
    padding: 15px;
    width: 250px;
    font-size: 18px;
    text-align: center;
}


.abrir {
    animation: abrir 1s forwards;
}


@keyframes aparecer {

from {
    opacity: 0;
    transform: scale(0.8);
}

to {
    opacity: 1;
    transform: scale(1);
}

}


@keyframes abrir {

0% {
    transform: scale(1);
    opacity: 1;
}

100% {
    transform: scale(1.5);
    opacity: 0;
}

}

</style>

</head>


<body>


<div class="container" id="inicio">

<img class="capa" src="capa.jpg">

<br>

<button onclick="abrirArquivo()">
ABRIR ARQUIVO
</button>

</div>



<div class="senha" id="senha">

<h2>DIGITE A SENHA</h2>

<input type="password" placeholder="Senha">

<br>

<button>
ENTRAR
</button>

</div>



<script>

function abrirArquivo(){

document.getElementById("inicio").classList.add("abrir");

setTimeout(function(){

document.getElementById("inicio").style.display="none";

document.getElementById("senha").style.display="block";

},1000);

}

</script>


</body>
</html>

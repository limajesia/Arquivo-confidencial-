<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arquivo</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;
background:#050505;
font-family:Arial,sans-serif;
color:white;

}



/* CAPA */

#inicio{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

}


.capa{

width:95%;
max-width:650px;

}



button{

margin-top:25px;
padding:15px 45px;

background:#8b0000;
color:white;

border:none;

font-size:18px;

letter-spacing:2px;

cursor:pointer;

}


button:hover{

background:#b30000;

}



/* SENHA */

#senha{

display:none;

height:100vh;

justify-content:center;
align-items:center;
flex-direction:column;

text-align:center;

}



input{

margin-top:20px;

padding:15px;

width:260px;

font-size:18px;

text-align:center;

}



.erro{

color:#ff4444;

}



/* ALBUM */

#arquivo{

display:none;

min-height:100vh;

padding:40px 20px;

background-image:url("interno.jpg");

background-size:cover;

background-position:center;

background-attachment:fixed;

}



.album{

max-width:650px;

margin:auto;

display:flex;

flex-direction:column;

align-items:center;

}



.foto{

width:90%;

max-width:450px;

margin:35px 0;

padding:12px;

background:white;

box-shadow:0 8px 25px black;

}



.foto:nth-child(even){

transform:rotate(2deg);

}



.foto:nth-child(odd){

transform:rotate(-2deg);

}



.titulo{

text-align:center;

font-size:30px;

letter-spacing:4px;

margin-bottom:30px;

}



</style>

</head>



<body>



<div id="inicio">


<img class="capa" src="capa.jpg">


<button onclick="abrirSenha()">

ABRIR ARQUIVO

</button>


</div>





<div id="senha">


<h2>DIGITE A SENHA</h2>


<input id="codigo" type="password" placeholder="Senha">


<button onclick="verificarSenha()">

ENTRAR

</button>


<p class="erro" id="erro"></p>


</div>






<div id="arquivo">


<div class="album">


<h1 class="titulo">

ARQUIVO CONFIDENCIAL

</h1>



<img class="foto" src="foto1.jpeg">
<img class="foto" src="foto2.jpeg">
<img class="foto" src="foto3.jpeg">
<img class="foto" src="foto4.jpeg">
<img class="foto" src="foto5.jpeg">

<img class="foto" src="foto6.jpeg">
<img class="foto" src="foto7.jpeg">
<img class="foto" src="foto8.jpeg">
<img class="foto" src="foto9.jpeg">
<img class="foto" src="foto10.jpeg">

<img class="foto" src="foto11.jpeg">
<img class="foto" src="foto12.jpeg">
<img class="foto" src="foto13.jpeg">
<img class="foto" src="foto14.jpeg">
<img class="foto" src="foto15.jpeg">

<img class="foto" src="foto16.jpeg">
<img class="foto" src="foto17.jpeg">
<img class="foto" src="foto18.jpeg">
<img class="foto" src="foto19.jpeg">
<img class="foto" src="foto20.jpeg">

<img class="foto" src="foto21.jpeg">
<img class="foto" src="foto22.jpeg">
<img class="foto" src="foto23.jpeg">
<img class="foto" src="foto24.jpeg">



</div>


</div>





<script>


function abrirSenha(){

document.getElementById("inicio").style.display="none";

document.getElementById("senha").style.display="flex";

}





function verificarSenha(){


let senha = document.getElementById("codigo").value;



if(senha === "07082001DRB"){


document.getElementById("senha").style.display="none";


document.getElementById("arquivo").style.display="block";


}

else{


document.getElementById("erro").innerHTML="SENHA INCORRETA";


}


}


</script>



</body>

</html>

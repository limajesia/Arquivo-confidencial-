<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivo Confidencial</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            background:#111;

            display:flex;
            justify-content:center;
            align-items:center;

            min-height:100vh;

            font-family:Arial, Helvetica, sans-serif;

        }

        .arquivo{

            width:700px;
            max-width:90%;

            background:#d8c49b;

            border:8px solid #8a7653;

            padding:60px;

            position:relative;

            box-shadow:0 0 40px rgba(0,0,0,.5);

        }

        .carimbo{

            position:absolute;

            top:30px;
            right:30px;

            border:4px solid #b30000;

            color:#b30000;

            padding:10px 18px;

            font-size:30px;

            font-weight:bold;

            transform:rotate(-12deg);

        }

        .codigo{

            color:#555;

            letter-spacing:4px;

            margin-bottom:30px;

            font-size:15px;

        }

        h1{

            font-size:52px;

            color:#222;

            margin-bottom:10px;

        }

        h2{

            color:#555;

            margin-bottom:30px;

            font-weight:normal;

        }

        p{

            color:#333;

            font-size:19px;

            line-height:30px;

        }

        button{

            margin-top:45px;

            padding:16px 45px;

            border:none;

            background:#222;

            color:white;

            font-size:20px;

            cursor:pointer;

            transition:.3s;

        }

        button:hover{

            background:#8b0000;

            transform:scale(1.05);

        }

    </style>

</head>

<body>

<div class="arquivo">

<div class="carimbo">
CONFIDENCIAL
</div>

<div class="codigo">
ARQUIVO Nº 01-2909
</div>

<h1>Dossiê Confidencial</h1>

<h2>Acesso Restrito</h2>

<p>
Este arquivo contém registros pessoais e lembranças importantes.
Somente pessoas autorizadas poderão continuar.
</p>

<button>
ENTRAR
</button>

</div>

</body>

</html>
